<!doctype html>
<html lang="en">
 <head>
   <meta charset="UTF-8" />
   <meta name="viewport" content="width=device-width, initial-scale=1.0" />
   <title>Flexiq Verve — Bank Smarter, Build Credit</title>
   <meta name="description" content="Flexiq Verve provides secure, fast, and reliable digital banking — save, send, pay, and build your credit from one beautiful app.">
   <meta name="author" content="Flexiq Verve" />
   <link rel="icon" href="/favicon.png" type="image/png" />
   <link rel="preconnect" href="https://fonts.googleapis.com" />
   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
   <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
   <link rel="preload" as="image" href="/logo.png">

   <!-- Decide chat visibility BEFORE first paint so the bubble never flashes where it is not allowed.
        The React LiveChat component keeps this in sync on every route change. Keep both rules identical.
        Visible: public pages + /dashboard/support.
        Hidden: /login, /signup, /pin, /pending and every other /dashboard page. -->
   <script>
     (function () {
       var p = location.pathname.replace(/\/+$/, "") || "/";
       var support = p === "/dashboard/support" || p.indexOf("/dashboard/support/") === 0;
       var hide =
         !support &&
         (p.indexOf("/dashboard") === 0 ||
           p === "/login" || p === "/signup" || p === "/pin" || p === "/pending");
       if (hide) {
         document.documentElement.classList.add("chat-hidden");
         // Tell Chatwoot not to draw the bubble at all on first load
         window.chatwootSettings = { hideMessageBubble: true };
       }
     })();
   </script>
   <style>
     /* Hide the Chatwoot bubble + window wherever chat is not allowed */
     html.chat-hidden .woot--bubble-holder,
     html.chat-hidden .woot-widget-bubble,
     html.chat-hidden .woot-widget-holder,
     html.chat-hidden #cw-widget-holder,
     html.chat-hidden iframe[name="chatwoot_live_chat_widget"] {
       display: none !important;
       visibility: hidden !important;
       pointer-events: none !important;
     }
   </style>
 </head>

 <body>
   <div id="root"></div>
   <script type="module" src="/src/main.tsx"></script>

   <!-- Google Translate (hidden widget, controlled by custom dropdown) -->
   <div id="gt_widget" style="display:none"></div>
   <script type="text/javascript">
     function googleTranslateElementInit() {
       new google.translate.TranslateElement(
         { pageLanguage: 'en', autoDisplay: false },
         'gt_widget'
       );
     }
   </script>
   <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
   <style>
     /* Google Translate adds a banner and pushes the page down; keep it flat at the top */
     .goog-te-banner-frame,
     iframe.skiptranslate,
     .skiptranslate > iframe,
     .VIpgJd-ZVi9od-ORHb-OEVmcd { display: none !important; visibility: hidden !important; height: 0 !important; }
     html, body { top: 0 !important; margin-top: 0 !important; position: static !important; }
     #goog-gt-tt { display: none !important; }
   </style>

   <!-- Auto-translate to user's browser language -->
   <script>
     window.addEventListener('load', function () {
       const browserLang = navigator.language || navigator.userLanguage;
       const lang = browserLang.split('-')[0];

       if (lang === 'en') return;

       const interval = setInterval(function () {
         const select = document.querySelector('.goog-te-combo');
         if (!select) return;
         clearInterval(interval);

         const langMap = {
           zh: 'zh-CN',
           pt: 'pt',
           fr: 'fr',
           es: 'es',
           de: 'de',
           ar: 'ar',
           ru: 'ru',
           ja: 'ja',
           ko: 'ko',
           it: 'it',
           hi: 'hi',
         };

         const targetLang = langMap[lang] || lang;
         select.value = targetLang;
         select.dispatchEvent(new Event('change'));
       }, 500);
     });
   </script>

   <!-- Start of live chat code -->
   <script>
  (function(d,t) {
    var BASE_URL="https://app.chatwoot.com";
    var g=d.createElement(t),s=d.getElementsByTagName(t)[0];
    g.src=BASE_URL+"/packs/js/sdk.js";
    g.async = true;
    s.parentNode.insertBefore(g,s);
    g.onload=function(){
      window.chatwootSDK.run({
        websiteToken: 'Ub8tuhebse3vptsdP3z3KGND',
        baseUrl: BASE_URL
      })
    }
  })(document,"script");
</script>
   <!-- End of live chat code -->
 </body>
</html>
