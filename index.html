<!doctype html>
<html lang="en">
 <head>
   <meta charset="UTF-8" />
   <meta name="viewport" content="width=device-width, initial-scale=1.0" />
   <title>Flexiq Verve — Bank Smarter, Build Credit</title>
   <meta name="description" content="Flexiq Verve provides secure, fast, and reliable digital banking — save, send, pay, and build your credit from one beautiful app.">
   <meta name="author" content="Flexiq Verve" />
   <link rel="icon" href="/favicon.png" type="image/png" />
   <link rel="preconnect" href="https://fonts.googleapis.com" />
   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
   <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
   <link rel="preload" as="image" href="/logo.png">
 </head>

 <body>
   <div id="root"></div>
   <script type="module" src="/src/main.tsx"></script>

   <!-- Google Translate (hidden widget, controlled by custom dropdown) -->
   <div id="gt_widget" style="display:none"></div>
   <script type="text/javascript">
     function googleTranslateElementInit() {
       new google.translate.TranslateElement(
         { pageLanguage: 'en', autoDisplay: false },
         'gt_widget'
       );
     }
   </script>
   <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
   <style>
     /* Google Translate adds a banner and pushes the page down; keep it flat at the top */
     .goog-te-banner-frame,
     iframe.skiptranslate,
     .skiptranslate > iframe,
     .VIpgJd-ZVi9od-ORHb-OEVmcd { display: none !important; visibility: hidden !important; height: 0 !important; }
     html, body { top: 0 !important; margin-top: 0 !important; position: static !important; }
     #goog-gt-tt { display: none !important; }
   </style>

   <!-- Auto-translate to user's browser language -->
   <script>
     window.addEventListener('load', function () {
       const browserLang = navigator.language || navigator.userLanguage;
       const lang = browserLang.split('-')[0];

       if (lang === 'en') return;

       const interval = setInterval(function () {
         const select = document.querySelector('.goog-te-combo');
         if (!select) return;
         clearInterval(interval);

         const langMap = {
           zh: 'zh-CN',
           pt: 'pt',
           fr: 'fr',
           es: 'es',
           de: 'de',
           ar: 'ar',
           ru: 'ru',
           ja: 'ja',
           ko: 'ko',
           it: 'it',
           hi: 'hi',
         };

         const targetLang = langMap[lang] || lang;
         select.value = targetLang;
         select.dispatchEvent(new Event('change'));
       }, 500);
     });
   </script>

   <!-- Start of Tidio chat code -->
   <script src="//code.tidio.co/adycjwsvby1wec0c9es41p7uepd8z3co.js" async></script>
   <!-- Keep the Tidio bubble above the mobile bottom nav; the opened chat stays full-size -->
   <style>
     @media (max-width: 767px) {
       html:not(.tidio-open) #tidio-chat-iframe {
         bottom: calc(96px + env(safe-area-inset-bottom, 0px)) !important;
       }
     }
   </style>
   <script>
     document.addEventListener("tidioChat-ready", function () {
       window.tidioChatApi.on("open", function () { document.documentElement.classList.add("tidio-open"); });
       window.tidioChatApi.on("close", function () { document.documentElement.classList.remove("tidio-open"); });
     });
   </script>
   <!-- End of Tidio chat code -->
 </body>
</html>
